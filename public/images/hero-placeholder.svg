<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#16161a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#26262d" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="halo" cx="50%" cy="35%" r="60%">
      <stop offset="0" stop-color="#e6ff04" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e6ff04" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#g)"/>
  <rect width="600" height="800" fill="url(#grid)"/>
  <rect width="600" height="800" fill="url(#halo)"/>
  <g transform="translate(300 340)" font-family="Space Grotesk, system-ui" text-anchor="middle">
    <text y="0" font-size="92" font-weight="700" fill="#f5f5f0" letter-spacing="4">DEMO</text>
    <text y="84" font-size="92" font-weight="700" fill="#e6ff04" letter-spacing="4">TONE</text>
    <text y="160" font-size="14" letter-spacing="6" fill="#a8a89e">FOTO PRINCIPAL</text>
  </g>
  <g stroke="#e6ff04" stroke-width="1" fill="none">
    <path d="M20 20 h20 M20 20 v20"/>
    <path d="M580 20 h-20 M580 20 v20"/>
    <path d="M20 780 h20 M20 780 v-20"/>
    <path d="M580 780 h-20 M580 780 v-20"/>
  </g>
</svg>
